name: Build and deploy Dr Youssef Tafnaouti
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-docteur-youssef-tafnouti
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Lovable website (static prerender)
        run: bun run build
      - name: Verify built static site
        run: |
          test -f .output/public/index.html
          test -d .output/public
          test -n "$(find .output/public -type f -name '*.js' -print -quit)"
      - name: Check authorized Firebase target
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const rc=JSON.parse(fs.readFileSync('.firebaserc'));
          const cfg=JSON.parse(fs.readFileSync('firebase.json'));
          const h=Array.isArray(cfg.hosting)?cfg.hosting[0]:cfg.hosting;
          if(rc.projects.default!=='docteur-youssef-tafnouti'||h.site!=='docteur-youssef-tafnouti'||h.public!=='.output/public') throw Error('Unexpected Firebase deployment target');
          NODE
      - name: Deploy Firebase on validated main push or manual run
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCTEUR_YOUSSEF_TAFNOUTI }}
          projectId: docteur-youssef-tafnouti
          channelId: live
